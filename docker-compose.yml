services:
  bot:
    build: .
    container_name: toshstat_quiz_bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBSITE_URL: ${WEBSITE_URL:-https://toshstat.uz}
      DATABASE_URL: ${DATABASE_URL}
      SHOW_LEADERBOARD: ${SHOW_LEADERBOARD:-true}
      LEADERBOARD_SHOW_NAMES: ${LEADERBOARD_SHOW_NAMES:-false}
    volumes:
      - bot_files:/app/data/files

volumes:
  bot_files:
